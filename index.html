<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a0f;--surf:#0a0e14;--panel:#0d141c;--line:#1d4a37;--accent:#10e86b;--on:#060a0f;--ink:#f1f5f9;--mute:#8da2b5;--ok:#10e86b;--bad:#ff3b53;--tint:rgba(16,232,107,.15);--glow:0 0 14px rgba(16,232,107,.4);--grid:rgba(16,232,107,.04);--halo:#0d1e18}
[data-theme="light"]{--bg:#f4f7fa;--surf:#eef3f0;--panel:#ffffff;--line:#bcd2c5;--accent:#047857;--on:#ffffff;--ink:#0f172a;--mute:#5b6b7d;--ok:#047857;--bad:#e11d48;--tint:rgba(5,150,105,.14);--glow:0 2px 10px rgba(5,150,105,.25);--grid:rgba(5,150,105,.05);--halo:#d8ece0}
*{box-sizing:border-box}
body{margin:0;background:var(--surf);color:var(--ink);font:17px/1.45 "Atkinson Hyperlegible",system-ui,sans-serif}
h1,h2,h3{font-family:Fredoka,system-ui,sans-serif;margin:0 0 8px}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;background:var(--panel);border-bottom:3px solid var(--accent)}
header b{font-family:Fredoka,sans-serif;color:var(--accent);font-size:20px}
#stats{font-size:15px;color:var(--mute)}
main{max-width:680px;margin:0 auto;padding:16px}
main.wide{max-width:980px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:2px solid var(--accent);background:transparent;color:var(--ink);padding:10px 14px;border-radius:8px;min-height:44px}
button.go{background:var(--accent);color:var(--on);font-weight:700}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
input,textarea,select{background:var(--surf);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:10px;width:100%}
.opt{display:block;width:100%;text-align:left;margin:8px 0;border-color:var(--line);background:var(--surf)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.tag{color:var(--mute);font-size:14px}
.bar{height:10px;background:var(--surf);border-radius:6px;overflow:hidden;border:1px solid var(--line)}.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.big{font-size:clamp(24px,6vw,36px)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lock{opacity:.5}
.rope{position:relative;height:46px;margin:10px 0 18px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,var(--surf) 8px 16px);border-radius:8px}
.rope .mid{position:absolute;left:50%;top:-6px;bottom:-6px;width:3px;background:var(--accent)}
.rope .knot{position:absolute;top:4px;width:38px;height:38px;border-radius:50%;background:var(--accent);transform:translateX(-50%);transition:left .25s;display:grid;place-items:center;color:var(--on);font-weight:700}
.fuse{height:16px;background:var(--surf);border-radius:8px;overflow:hidden;margin:4px 0 10px;border:1px solid var(--line)}.fuse i{display:block;height:100%;background:var(--bad)}
.tiles{display:flex;gap:6px;margin:6px 0}
.tile{width:42px;height:46px;display:grid;place-items:center;font:700 22px Fredoka,sans-serif;border-radius:6px;background:var(--surf);border:2px solid var(--line);position:relative}
.tile.g{background:var(--ok);color:var(--on);border-color:var(--ok)}
.tile.y{background:var(--accent);color:var(--on);border-color:var(--accent)}
.tile.g::after{content:"✓";position:absolute;right:3px;bottom:0;font-size:11px}
.tile.y::after{content:"~";position:absolute;right:4px;bottom:0;font-size:13px}
.track{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:8px 0}
.cell{height:46px;border-radius:6px;background:var(--surf);border:1px solid var(--line);display:grid;place-items:center;font-size:22px}
.cell.goal{border-color:var(--accent);background:var(--line)}
.board{position:relative;width:min(100%,360px);aspect-ratio:1;margin:8px auto;background:var(--surf);border:3px solid var(--line);border-radius:8px}
.board .gc{position:absolute;width:16.666%;height:16.666%;border:1px solid var(--line);background:transparent;border-radius:0;padding:0;min-height:0}
.board .exit{position:absolute;right:-14px;top:calc(2*16.666% + 4%);color:var(--accent);font-size:22px}
.car{position:absolute;border-radius:8px;border:2px solid var(--surf);display:grid;place-items:center;font:700 16px Fredoka,sans-serif;color:var(--on);padding:0;min-height:0;transition:left .15s,top .15s}
.car.sel{outline:3px solid var(--ink)}
.car.locked{background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(0,0,0,.25) 6px 9px)}
table{width:100%;border-collapse:collapse}
td,th{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line)}
.pill{padding:2px 8px;border-radius:99px;font-size:13px;background:var(--surf);border:1px solid var(--line)}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mc{min-height:76px;font-size:13px;padding:6px;line-height:1.25}.mc.up{border-color:var(--accent)}.mc.ok{background:var(--line)}.mc:disabled{opacity:1;color:var(--ink)}
.fall{position:relative;height:430px;overflow:hidden;border:2px solid var(--line);border-radius:8px;padding:8px}
.fall .fo{position:absolute;left:8px;right:8px;top:90px}.fall .line{position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--bad)}
.hp{height:16px;background:var(--surf);border-radius:8px;overflow:hidden;border:1px solid var(--line);margin-bottom:6px}.hp i{display:block;height:100%;background:var(--ok);transition:width .3s}
.gridh{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:340px;margin:8px auto}.gh{height:56px;font-size:20px;padding:0}.gh:disabled{opacity:.55}.gh.t:disabled{opacity:1}
.scr{font:700 28px Fredoka,sans-serif;letter-spacing:6px;text-align:center;margin:10px 0;word-break:break-word}
.kb{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}.kb button{padding:6px 0;min-height:40px}
.gm label{display:flex;gap:6px;align-items:center;margin-right:12px}.gm input{width:auto}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),radial-gradient(ellipse 90% 60% at 50% -10%,var(--halo) 0%,var(--bg) 75%);background-size:24px 24px,24px 24px,100% 100%;background-attachment:fixed}
header{box-shadow:0 4px 18px rgba(0,0,0,.3)}
.card{box-shadow:0 6px 24px rgba(0,0,0,.25)}
button{transition:transform .08s,border-color .15s,background .15s}
button:active:not(:disabled){transform:translateY(2px) scale(.99)}
button.go{box-shadow:0 3px 0 rgba(0,0,0,.35)}button.go:active:not(:disabled){box-shadow:0 1px 0 rgba(0,0,0,.35)}
.opt{display:flex;align-items:center;gap:10px;font-size:18px}
.k{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 4px;border-radius:6px;background:var(--line);font:700 14px Fredoka,sans-serif;color:var(--accent);flex:none}
.av{display:inline-grid;place-items:center;border-radius:50%;font-family:Fredoka,sans-serif;font-weight:700;color:#060a0f;border:3px solid rgba(255,255,255,.35);flex:none;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.vs{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0 12px}
.vs .who{text-align:center}.nm{font-weight:700;font-size:15px}.vsx{font:700 30px Fredoka,sans-serif;color:var(--accent)}
.gicon{font-size:64px;text-align:center;line-height:1.1;animation:bob 1.4s ease-in-out infinite alternate}
.cd{font:700 96px/1 Fredoka,sans-serif;text-align:center;color:var(--accent);animation:pulse .5s ease-out}
@keyframes pulse{from{transform:scale(1.7);opacity:.2}to{transform:scale(1);opacity:1}}
@keyframes bob{from{transform:translateY(-4px)}to{transform:translateY(4px)}}
.hud{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tbar{height:6px;background:var(--surf);border-radius:4px;overflow:hidden;margin-bottom:12px}.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--bad));transition:width .5s linear}
.pop{position:fixed;z-index:50;font:700 28px Fredoka,sans-serif;pointer-events:none;animation:floatup .85s ease-out forwards;text-shadow:0 2px 6px rgba(0,0,0,.5)}
@keyframes floatup{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-70px) scale(1.3)}}
.flash-ok{animation:fok .4s}.flash-bad{animation:fbad .4s}
@keyframes fok{0%{box-shadow:0 0 0 0 rgba(76,195,138,.9)}100%{box-shadow:0 0 0 22px rgba(76,195,138,0)}}
@keyframes fbad{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.conf{position:fixed;top:-14px;width:10px;height:14px;z-index:60;pointer-events:none;animation:cfall 2.4s linear forwards}
@keyframes cfall{to{transform:translateY(108vh) rotate(720deg)}}
.radar{position:relative;width:120px;height:120px;margin:10px auto}.radar i{position:absolute;inset:0;border:3px solid var(--accent);border-radius:50%;animation:ping 2s ease-out infinite;opacity:0}.radar i:nth-child(2){animation-delay:.65s}.radar i:nth-child(3){animation-delay:1.3s}.radar b{position:absolute;inset:44px;background:var(--accent);border-radius:50%}
@keyframes ping{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.2);opacity:0}}
.lb .r{display:flex;align-items:center;gap:8px;margin:6px 0}.lb .r.me{color:var(--accent);font-weight:700}.lb .r .bar{flex:1}
.dots{display:flex;gap:6px;justify-content:center;margin:8px 0}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent)}.dots i.on{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.ic{min-height:36px;padding:4px 10px}
.tug{display:flex;align-items:center;gap:10px}.tug .rope{flex:1;margin:10px 0}
.rope .knot{font-size:24px;background:none;width:auto;height:auto}
.btrack{position:relative;display:flex;justify-content:space-between;align-items:center;height:84px}
.bomb{position:absolute;top:10px;font-size:54px;transform:translateX(-50%);transition:left .4s;animation:wob .3s ease-in-out infinite alternate}.bomb.danger{filter:drop-shadow(0 0 12px var(--bad))}
@keyframes wob{from{rotate:-9deg}to{rotate:9deg}}
.cell{position:relative;overflow:hidden}.cell.lane{background:repeating-linear-gradient(0deg,var(--surf) 0 10px,var(--line) 10px 20px)}
.rc{position:absolute;left:50%;top:0;font-size:22px;animation:drive 2.2s linear infinite}
@keyframes drive{from{transform:translate(-50%,-120%)}to{transform:translate(-50%,120%)}}
.hop{display:inline-block;animation:hop .3s ease-out}@keyframes hop{from{transform:translateY(-14px)}to{transform:none}}
.tile.flip{animation:flip .45s backwards}@keyframes flip{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
.board{background:repeating-linear-gradient(0deg,var(--line) 0 2px,transparent 2px 16.666%),var(--surf)}
.car{box-shadow:0 3px 6px rgba(0,0,0,.4)}.car::before{content:"";position:absolute;inset:20% 14%;border-radius:6px;background:rgba(255,255,255,.28);pointer-events:none}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mcard{position:relative;height:88px;padding:0;border:0;background:none;perspective:600px;min-height:0}
.mf{position:absolute;inset:0;display:grid;place-items:center;padding:6px;font-size:13px;line-height:1.2;border:2px solid var(--accent);border-radius:10px;backface-visibility:hidden;transition:transform .35s;background:var(--surf);color:var(--ink)}
.mf.f{font:700 30px Fredoka,sans-serif;color:var(--accent);background:linear-gradient(135deg,var(--line),var(--surf))}
.mf.b{transform:rotateY(180deg);background:var(--line)}.mf.b.t{font-weight:700;font-size:15px}
.mcard.up .f{transform:rotateY(180deg)}.mcard.up .b{transform:rotateY(0)}.mcard.ok .b{border-color:var(--ok);background:var(--tint)}
.fall{position:relative;height:430px;overflow:hidden;border:2px solid var(--line);border-radius:10px;padding:8px;background:linear-gradient(180deg,var(--surf),var(--line))}
.fall .fo{position:absolute;left:8px;right:8px;top:90px}.fall .line{position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--bad);box-shadow:0 0 14px var(--bad)}
.fall.boom{animation:fbad .4s}.opt.c0{border-left:6px solid #2d7dd2}.opt.c1{border-left:6px solid #8e5bd6}.opt.c2{border-left:6px solid #e0a030}.opt.c3{border-left:6px solid #2fb59b}
.fcard{background:var(--surf);border:3px solid var(--line);border-radius:14px;padding:22px 16px;text-align:center;margin:10px 0}
.fcard.sw-ok{animation:swok .35s}.fcard.sw-bad{animation:swbad .35s}
@keyframes swok{0%{border-color:var(--ok)}50%{transform:translateX(-34px) rotate(-2deg)}100%{transform:none;border-color:var(--line)}}
@keyframes swbad{0%{border-color:var(--bad)}50%{transform:translateX(34px) rotate(2deg)}100%{transform:none;border-color:var(--line)}}
.scr{font:700 28px Fredoka,sans-serif;letter-spacing:6px;text-align:center;margin:10px 0;word-break:break-word}
.kb{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}.kb button{padding:6px 0;min-height:40px}
.hg{display:flex;gap:14px;align-items:center}.hg>div:last-child{flex:1}
.chip{width:84px;height:84px;border-radius:50%;border:6px dashed rgba(255,255,255,.75);font:700 20px Fredoka,sans-serif;color:#fff;display:grid;place-items:center;min-height:0;padding:0;box-shadow:0 5px 0 rgba(0,0,0,.35);flex:none}
.chip.c1{background:#2d7dd2}.chip.c2{background:#8e5bd6}.chip.c3{background:var(--accent);color:var(--on)}
.arena{display:flex;align-items:center;justify-content:space-around;gap:8px;margin-bottom:8px}
.ft{text-align:center;flex:1;transition:transform .2s}.ft .hp{margin:6px auto;max-width:150px}
.lunge-r{transform:translateX(34px)}.lunge-l{transform:translateX(-34px)}
.hurt{animation:fbad .5s}.hurt .av{background:var(--bad)!important}
.shield .av{box-shadow:0 0 0 7px rgba(108,182,255,.75)}.heal .av{box-shadow:0 0 0 7px rgba(76,195,138,.85)}
.mv{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;font-size:18px;min-height:96px}
.gh.t.pop2{animation:flip .35s}
.gh.gem{background:var(--accent);color:var(--on)}
.bgrid{display:grid;gap:14px;grid-template-columns:1.5fr 1fr;align-items:start}@media(max-width:800px){.bgrid{grid-template-columns:1fr}}
.lb.big{font-size:21px}.lb.big .r{margin:9px 0}.bn{min-width:170px}.bw{min-width:30px;text-align:right}
.frz{position:fixed;inset:0;z-index:70;background:rgba(40,120,200,.55);backdrop-filter:blur(3px);display:grid;place-items:center;text-align:center;color:#fff;animation:pulse .3s}
#pucard b{color:var(--accent)}
.rulesm{position:fixed;inset:0;z-index:40;background:rgba(7,20,36,.9);display:grid;place-items:center;padding:16px;overflow:auto}
.rm{max-width:580px;width:100%;animation:pulse .25s}.rm .rl{font-size:19px;line-height:1.5;padding-left:22px;margin:8px 0}.rm .rl li{margin:6px 0}.rm .cd{font-size:72px}
.guide{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:10px}
.gd{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:10px}.gdh{display:flex;align-items:center;gap:8px;margin-bottom:4px}.gd ul{margin:0;padding-left:18px;font-size:14px}
summary{cursor:pointer}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:42px;height:42px;border-radius:9px;border:2px solid var(--accent);box-shadow:var(--glow);object-fit:cover;background:#000}
.brand-col{display:flex;flex-direction:column;line-height:1.1}
.brand-name{font:700 20px Fredoka,sans-serif;color:var(--accent)}
.brand-sub{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.bb-hero{display:flex;justify-content:center;margin:0 0 12px}
.bb-hero img{width:100%;height:auto;border-radius:12px;border:2px solid var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.45),var(--glow);background:#05080c}
header{border-bottom:2px solid var(--accent);box-shadow:0 4px 18px rgba(0,0,0,.35)}
.card{border-color:var(--line)}
button:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:var(--tint);box-shadow:var(--glow)}
button.go{box-shadow:0 3px 0 rgba(0,0,0,.35)}
button.go:hover:not(:disabled){background:var(--accent);color:var(--on);filter:brightness(1.12)}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:var(--glow)}
.bar i{background:linear-gradient(90deg,var(--accent),#00f0ff);box-shadow:var(--glow)}
.vsx{color:#ff3b53;text-shadow:0 0 14px rgba(255,59,83,.45)}
.clapjoy{position:fixed;z-index:90;pointer-events:none;animation:clapin 1.25s ease-out forwards}
@keyframes clapin{0%{transform:scale(.2) rotate(-20deg);opacity:0}25%{transform:scale(1.25) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:0}}
@keyframes clapfade{0%{opacity:0}30%{opacity:.9}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.clapjoy{animation:clapfade 1s forwards}}
@media(prefers-reduced-motion:reduce){.conf,.pop{display:none}.gicon,.bomb,.rc{animation:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

    const m={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'u',w:'u',W:'u',ArrowDown:'d',s:'d',S:'d'}[e.key];
    if(m){e.preventDefault();mv(m)}else if((e.key===' '||e.key==='Enter')&&g.s.dead){e.preventDefault();again()}};

const NM={a:'attacked',s:'shielded',h:'healed',n:'did nothing'};
G.tug={name:'Tug of War',hint:'Answer correctly to pull the flag your way. Get 5 ahead of your opponent to win! Keys 1-4 answer.',
init(c){const next=makeDeck(c.pairs,rng(c.seed)),P=ok=>ok?'Pull!':'✗';let me=0,opp=0,lock=0,q=nq(next,P);

G.hot={name:'Hot Potato',hint:'Your fuse only burns while you hold the bomb. Answer right to pass it on. Wrong answers burn 3 seconds!',
init(c){const next=makeDeck(c.pairs,rng(c.seed)),P=ok=>ok?'Pass!':'-3s';let q=nq(next,P),turn=c.first?'me':'opp',mf=20000,of=20000,passes=0,last=Date.now(),wrong=new Set();

  const draw=full=>{if(c.ended)return;$('#f1').style.width=Math.max(0,mf/200)+'%';$('#f2').style.width=Math.max(0,of/200)+'%';
    const b=$('#bm'),fu=turn==='me'?mf:of;b.style.left=turn==='me'?'14%':'86%';b.style.animationDuration=Math.max(.12,fu/20000*.7)+'s';b.classList.toggle('danger',fu<6000);

    else{mf-=3000;wrong.add(i);c.send(mf,{n:passes,fuse:mf})}
    draw()}
  c.every(100,()=>{const t=Date.now(),dt=t-last;last=t;if(turn==='me')mf-=dt;else of-=dt;
    if(mf<=0&&!c.ended){mf=0;c.lose()}draw(false)});
  c.onOpp(o=>{const x=o.x||{};if(x.fuse!=null)of=x.fuse;let p=false;while(passes<(x.n||0)){passes++;q=nq(next,P);p=true}

G.road={name:'Road Race',hint:'Each correct answer moves you one step across the busy road. A wrong answer sends you back a step. First across wins!',
init(c){const next=makeDeck(c.pairs,rng(c.seed)),N=8,P=ok=>ok?'Step!':'Back!';let step=0,opp=0,lock=0,q=nq(next,P);

  const tr=(id,p,ic)=>{let h='';for(let i=0;i<=N;i++){const lane=i>0&&i<N;

      h+=`<div class="cell ${i===N?'goal':''} ${lane?'lane':''}">${car}${i===p?`<span class="hop">${ic}</span>`:(i===N?'🏁':(i===0?'🏠':''))}</div>`}$(id).innerHTML=h};
  const draw=()=>{if(c.ended)return;tr('#t1',step,'🐔');tr('#t2',opp,'🐤');mcq($('#qa'),q,ans,Date.now()<lock)};

  c.skip=()=>{if(Date.now()<lock)return false;q=nq(next,P);draw();return true};c.onOpp(o=>{opp=o.v||0;draw()});draw()}};

G.memo={name:'Memory Match',hint:'Flip cards to match each term with its definition. Clear all 6 pairs first!',
init(c){const r=rng(c.seed),idx=shuf(c.pairs.map((_,i)=>i),r).slice(0,6);
  const cards=shuf(idx.flatMap(i=>[{p:i,t:c.pairs[i][0],k:'t'},{p:i,t:c.pairs[i][1],k:'d'}]),r);

  const els=[...$('#mm').children];

    const e=$('#st');if(e)e.textContent=`You ${got.size}/6 · ${c.oppName} ${opp}/6`};

      else{lock=true;c.after(900,()=>{open=[];lock=false;upd()})}}}
  c.onOpp(o=>{opp=o.v||0;upd()});upd()}};

G.fall={name:'Falling Answers',dur:45000,hint:'Answers fall toward the red line. Tap (or press 1-4) the right one before it lands! +1 right, -1 wrong. Highest score after 45 seconds wins.',
init(c){const next=makeDeck(c.pairs,rng(c.seed)),FALL=7000,t0=Date.now(),P=ok=>ok?'+1':'-1';let q=nq(next,P),sc=0,opp=0,qs=0,fin=false;

    if(ok){sc++;c.send(sc);q=nq(next,P);setQ()}else{sc--;b.disabled=true;c.send(sc)}upd()}

    if(t-t0>=45000){fin=true;c.root.innerHTML='<p class="big" style="text-align:center">Time! Waiting for your opponent…</p>';c.fin(sc);return}

G.ana={name:'Anagram Race',hint:'Unscramble the key term using the clue. Solve all 4 first!',
init(c){const r=rng(c.seed);let cand=c.pairs.map(p=>[p[0].replace(/[\s-]/g,''),p[1]]).filter(p=>/^[A-Za-z]{4,12}$/.test(p[0]));

G.hang={name:'Hangman Duel',hint:'Type or tap letters to uncover the hidden term from its definition. A wrong letter freezes you for 1.5 seconds. Solve 3 terms first!',
init(c){const r=rng(c.seed);let cand=c.pairs.filter(p=>/^[A-Za-z][A-Za-z \-]{2,18}$/.test(p[0]));if(cand.length<3)cand=c.pairs;

    $('#fg').innerHTML=fig(Math.min(miss,6));

G.wager={name:'Wager Duel',hint:'Pick a chip (bet 1 to 3), then answer. Right wins your bet, wrong loses it. 6 questions and the highest score wins!',
init(c){const next=makeDeck(c.pairs,rng(c.seed)),N=6;let n=0,sc=0,bet=0,fin=false;

G.card={name:'Card Duel',hint:'Each round, answer right to earn a move: Attack (3 damage), Shield (blocks 2), Heal (+2). Both moves resolve together. 6 rounds or a knockout!',
init(c){const next=makeDeck(c.pairs,rng(c.seed)),MAXR=6,P=ok=>ok?'Correct!':'✗';let hp=10,ohp=10,round=1,q=nq(next,P),ph='q',M={},O={},over=false,log='';
  c.root.innerHTML=`<div class="arena"><div class="ft" id="fm">${av(c.meName,64)}<div class="nm">You</div><div class="hp"><i id="h1"></i></div><div class="tag" id="t1"></div></div><div class="vsx">⚔</div><div class="ft" id="fo2">${av(c.oppName,64)}<div class="nm">${esc(c.oppName)}</div><div class="hp"><i id="h2"></i></div><div class="tag" id="t2"></div></div></div><p class="tag" id="st" style="text-align:center"></p><div id="qa"></div>`;
  const anim=(id,cl)=>{const e=$(id);if(!e)return;e.classList.add(cl);c.after(700,()=>e.classList.remove(cl))};
  const draw=()=>{if(c.ended)return;$('#h1').style.width=Math.max(0,hp*10)+'%';$('#h2').style.width=Math.max(0,ohp*10)+'%';$('#t1').textContent=Math.max(0,hp)+'/10';$('#t2').textContent=Math.max(0,ohp)+'/10';
    $('#st').textContent=`Round ${Math.min(round,MAXR)} of ${MAXR}. ${log}`;
    if(over){$('#qa').innerHTML='<p class="big" style="text-align:center">Battle over!</p>';return}
    if(ph==='q')mcq($('#qa'),q,a=>{if(a===q.ans){ph='pick';draw()}else setM('n')});
    else if(ph==='pick'){$('#qa').innerHTML=`<p class="big" style="text-align:center">Correct! Choose your move:</p><div class="row">${[['a','⚔️','Attack','3 dmg'],['s','🛡️','Shield','blocks 2'],['h','💚','Heal','+2 HP']].map((m,i)=>`<button class="go mv" data-m="${m[0]}"><span class="k">${i+1}</span><span style="font-size:30px">${m[1]}</span><b>${m[2]}</b><span class="tag" style="color:var(--on)">${m[3]}</span></button>`).join('')}</div>`;
      $('#qa').querySelectorAll('.mv').forEach(b=>b.onclick=()=>setM(b.dataset.m))}
    else $('#qa').innerHTML='<p class="big" style="text-align:center">Waiting for your opponent…</p>'};
  function setM(m){M[round]=m;ph='wait';c.send(hp-ohp,{r:round,m,pm:M[round-1]||null});draw();resolve()}
  function resolve(){let ch=false;
    while(!over&&M[round]!==undefined&&O[round]!==undefined){ch=true;const m=M[round],o=O[round];
      const dm=o==='a'?(m==='s'?1:3):0,dd=m==='a'?(o==='s'?1:3):0;
      hp=Math.min(10,hp-dm+(m==='h'?2:0));ohp=Math.min(10,ohp-dd+(o==='h'?2:0));
      log=`Last round: you ${NM[m]}, they ${NM[o]}.`;
      if(m==='a')anim('#fm','lunge-r');if(o==='a')anim('#fo2','lunge-l');if(dm>0)anim('#fm','hurt');if(dd>0)anim('#fo2','hurt');
      if(m==='s')anim('#fm','shield');if(o==='s')anim('#fo2','shield');if(m==='h')anim('#fm','heal');if(o==='h')anim('#fo2','heal');
      sfx(dm>0?'hit':(m==='h'||m==='s')?'ok':'tick');
      if(hp<=0||ohp<=0||round>=MAXR){over=true;const win=hp>ohp||(hp===ohp&&c.first);draw();if(win)c.win();return}
      round++;q=nq(next,P);ph='q'}
    if(ch)draw()}
  c.onOpp(o=>{const x=o.x;if(!x||!x.r)return;O[x.r]=x.m;if(x.pm&&x.r>1&&O[x.r-1]===undefined)O[x.r-1]=x.pm;resolve()});draw()}};

G.grid={name:'Grid Hunt',hint:'Answer a question to earn a shot, then tap a square. Numbers show how many treasures touch that square. Find all 3 treasures first!',
init(c){const r=rng(c.seed),T=new Set();while(T.size<3)T.add(r()*25|0);
  const next=makeDeck(c.pairs,rng(c.seed+3)),P=ok=>ok?'Shot!':'✗';let q=nq(next,P),ready=false,tried=new Set(),found=0,opp=0,lock=0,last=-1;
  const nb=i=>{let n=0;const y=i/5|0,x=i%5;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dy&&!dx)continue;const yy=y+dy,xx=x+dx;if(yy<0||yy>4||xx<0||xx>4)continue;if(T.has(yy*5+xx))n++}return n};
  c.root.innerHTML=`<p class="tag" id="st" style="text-align:center"></p><div class="gridh" id="gd"></div><div id="qa"></div>`;
  const draw=()=>{if(c.ended)return;$('#st').textContent=`Treasures found: you ${found}/3 · ${c.oppName} ${opp}/3`;
    $('#gd').innerHTML=Array.from({length:25},(_,i)=>{const t=tried.has(i);return `<button class="gh ${t?'t':''} ${t&&T.has(i)?'gem':''} ${i===last?'pop2':''}" data-i="${i}" ${t||!ready?'disabled':''}>${t?(T.has(i)?'💎':(nb(i)||'·')):'?'}</button>`}).join('');
    $('#gd').querySelectorAll('.gh').forEach(b=>b.onclick=()=>shoot(+b.dataset.i,b));
    if(ready)$('#qa').innerHTML='<p class="big" style="text-align:center">Correct! Tap a square.</p>';
    else mcq($('#qa'),q,a=>{if(Date.now()<lock)return;if(a===q.ans)ready=true;else{q=nq(next,P);lock=Date.now()+1200;c.after(1250,draw)}draw()},Date.now()<lock)};
  function shoot(i,b){if(!ready||c.ended)return;tried.add(i);ready=false;last=i;const hit=T.has(i);if(hit){found++;fx(true,b,'💎!')}else sfx('tick');
    q=nq(next,P);c.send(found*100-tried.size);if(found>=3){draw();c.win();return}draw();last=-1}
  c.skip=()=>{if(ready||Date.now()<lock)return false;q=nq(next,P);draw();return true};c.onOpp(o=>{opp=Math.ceil((o.v||0)/100);draw()});draw()}};
G.word={name:'Wordle Race',hint:'Both of you are guessing the same hidden key term. The definition is your clue. ✓ = right place, ~ = in the word.',
init(c){const r=rng(c.seed);
  const cand=c.pairs.map(p=>[p[0].replace(/[\s-]/g,''),p[1]]).filter(p=>/^[A-Za-z]{4,12}$/.test(p[0]));
  const t=cand[r()*cand.length|0]||['network','A group of connected devices'],W=t[0].toUpperCase(),n=W.length;let rows=[],best=0,opp={g:0,b:0},fresh=false;
  c.root.innerHTML=`<p class="big">${esc(t[1])}</p><p class="tag">${n} letters</p><div id="rows"></div><p class="tag" id="hint"></p><div class="row"><input id="gi" maxlength="${n}" autocomplete="off" autocapitalize="characters" aria-label="Your guess"><button class="go" id="gb">Guess</button></div><p class="tag" id="msg"></p><p class="tag" id="op"></p>`;
  const draw=()=>{$('#rows').innerHTML=rows.map((rw,ri)=>`<div class="tiles">${rw.g.split('').map((ch,i)=>`<div class="tile ${rw.e[i]} ${fresh&&ri===rows.length-1?'flip':''}" style="animation-delay:${i*.1}s">${ch}</div>`).join('')}</div>`).join('');fresh=false;
    $('#hint').textContent=rows.length>=6?`Hints: starts with ${W[0]}, ends with ${W[n-1]}`:rows.length>=3?`Hint: starts with ${W[0]}`:'';
    $('#op').textContent=`Opponent: ${opp.g} guesses, best ${opp.b} letters right`};
  function go(){if(c.ended)return;const g=$('#gi').value.toUpperCase().replace(/[^A-Z]/g,'');
    if(g.length!==n){$('#msg').textContent=`Needs ${n} letters`;sfx('no');return}
    $('#msg').textContent='';const e=evalGuess(g,W);rows.push({g,e});best=Math.max(best,e.filter(x=>x==='g').length);
    $('#gi').value='';fresh=true;c.send(best,{g:rows.length,b:best});draw();if(g===W)fx(true,$('#gb'),'Solved!');else sfx('tick');if(g===W)c.win()}
  $('#gb').onclick=go;$('#gi').onkeydown=e=>{if(e.key==='Enter')go()};$('#gi').focus();
  c.onOpp(o=>{opp=o.x||opp;draw()});draw()}};

G.car={name:'Gated Car Unblock',hint:'Free the gold car X: tap a car, then tap where it should slide to. Striped cars are locked until you answer a question.',
init(c){const r=rng(c.seed);let cars=PUZ[r()*PUZ.length|0].map(x=>({...x}));
  const locked=new Set(shuf(cars.filter(x=>x.id!=='X').map(x=>x.id),r).slice(0,2)),next=makeDeck(c.pairs,rng(c.seed+7));
  let sel=null,ask=null,q=null,lock=0,oppC=0;
  const col=id=>id==='X'?'#10e86b':`hsl(${(id.charCodeAt(0)*47)%360} 60% 65%)`;
  c.root.innerHTML=`<div class="board" id="bd"></div><div id="qa"></div><p class="tag" id="st"></p>`;
  const draw=()=>{let h='<span class="exit">➜</span>';
    for(let y=0;y<6;y++)for(let x=0;x<6;x++)h+=`<button class="gc" style="left:${x*16.666}%;top:${y*16.666}%" data-r="${y}" data-c="${x}" aria-label="Row ${y+1} column ${x+1}"></button>`;
    cars.forEach(k=>{h+=`<button class="car ${sel===k.id?'sel':''} ${locked.has(k.id)?'locked':''}" data-id="${k.id}" style="left:${k.c*16.666}%;top:${k.r*16.666}%;width:${(k.h?k.len:1)*16.666}%;height:${(k.h?1:k.len)*16.666}%;background-color:${col(k.id)}" aria-label="Car ${k.id}${locked.has(k.id)?' locked':''}">${locked.has(k.id)?'🔒':k.id}</button>`});
    $('#bd').innerHTML=h;
    $('#bd').querySelectorAll('.car').forEach(b=>b.onclick=()=>pickCar(b.dataset.id));
    $('#bd').querySelectorAll('.gc').forEach(b=>b.onclick=()=>moveTo(+b.dataset.r,+b.dataset.c));
    $('#st').textContent=`Opponent's gold car is at column ${oppC+1} of 5`;
    if(ask){mcq($('#qa'),q,answer,Date.now()<lock)}else $('#qa').innerHTML=''};
  function pickCar(id){if(c.ended)return;if(locked.has(id)){ask=id;q=next();sel=null}else{sel=id;ask=null}draw()}
  function answer(i){if(c.ended||Date.now()<lock)return;
    if(i===q.ans){locked.delete(ask);sel=ask;ask=null}else{lock=Date.now()+2000;q=next();c.after(2050,draw)}
    draw()}
  function moveTo(y,x){if(!sel||c.ended)return;const n=moveCar(cars,sel,y,x);if(!n)return;cars=n;sfx('pass');
    const X=cars[0];c.send(X.c,{c:X.c});draw();if(X.c===4)c.win()}
  c.skip=()=>{if(!ask)return false;q=next();draw();return true};c.onOpp(o=>{oppC=(o.x&&o.x.c)||0;$('#st').textContent=`Opponent's gold car is at column ${oppC+1} of 5`});draw()}};
const GAMES=Object.keys(G);

/* ================= STUDENT ================= */
function startStudent(){
  const SK='duel_'+ROOM+'_';let pid=localStorage.getItem(SK+'pid');
  if(!pid){pid='p'+Math.random().toString(36).slice(2,9);localStorage.setItem(SK+'pid',pid)}
  let cfg={target:5,over:null,topic:null},pairs=DEFAULT_TOPIC,me=null,cur=null,done=new Set(),first=true,leader=null,allP={},entering=null,lastReset=null,live=false,overShown=false,waitOn=false,lastHeld='',inLobby=false,stopLobby=null,lobbyS={},holdOn=false,choosing=false,clapTot=0,clapN=0,clapT=null,lastC=0;
  const CU={charge:0,q:null,next:null,lock:0,msg:''};
  const myPU=()=>me&&me.pu&&PUS[me.pu]?me.pu:null;
  const myName=()=>(me&&me.name)||localStorage.getItem(SK+'name')||'You';
  const myWins=()=>me&&me.stats?me.stats.wins:0;
  const stats=()=>{const s=me&&me.stats||{rank:1000,wins:0};
    $('#stats').textContent=me&&me.name?`${me.name} · Wins ${s.wins}/${cfg.target} · Rank ${Math.round(s.rank)}${leader&&leader.name!==me.name?` · Leader: ${leader.name} (${leader.wins})`:''}${myPU()?` · ${PUS[myPU()].i} ${PUS[myPU()].n}`:''}`:''};
  const view=h=>{live=false;waitOn=false;holdOn=false;choosing=false;if(inLobby){inLobby=false;if(stopLobby){stopLobby();stopLobby=null}}V.innerHTML=h};
  const phaseLive=()=>cfg.phase==='live';
  const lbHtml=()=>{const rows=Object.entries(allP).filter(([k,p])=>p.name).map(([k,p])=>({k,n:p.name,w:p.stats?p.stats.wins:0,r:p.stats?p.stats.rank:1000})).sort((a,b)=>b.w-a.w||b.r-a.r).slice(0,5);
    return `<div class="lb"><p class="tag">Race to ${cfg.target} wins</p>${rows.map(x=>`<div class="r ${x.k===pid?'me':''}">${av(x.n,26)}<span style="min-width:90px">${esc(x.n)}</span><div class="bar"><i style="width:${Math.min(100,x.w/cfg.target*100)}%"></i></div><span>${x.w}</span></div>`).join('')}</div>`};
  const dotsHtml=()=>Array.from({length:cfg.target},(_,i)=>`<i class="${i<myWins()?'on':''}"></i>`).join('');
  const refreshLive=()=>{if(!live)return;const a=$('#lbw'),b=$('#dts'),w=$('#wn');if(a)a.innerHTML=lbHtml();if(b)b.innerHTML=dotsHtml();if(w)w.textContent=`${myWins()} of ${cfg.target} wins`;if(waitOn){renderPU();const h=myPU()||'';if(h!==lastHeld){lastHeld=h;renderCU()}}};
  function renderPU(){const el=$('#pucard');if(!el||!waitOn)return;if(cfg.nopu){el.style.display='none';return}el.style.display='';const k=myPU();
    el.innerHTML=k?`<div class="row"><span style="font-size:40px">${PUS[k].i}</span><div><b>${PUS[k].n}</b><div class="tag">${PUS[k].d}</div></div></div>`:'<p class="tag" style="margin:0">⚡ No power-up yet. Charge up below, or you get a consolation power-up after a loss.</p>'}
  function cuNew(){CU.next=CU.next||makeDeck(pairs,rng(Date.now()|0));CU.q=CU.next();CU.q.pt=ok=>ok?'⚡':'✗'}
  function renderCU(){const el=$('#cu');if(!el||!waitOn)return;if(cfg.nopu){el.style.display='none';return}el.style.display='';
    if(myPU()){el.innerHTML='<p class="tag" style="margin:0">⚡ Power-up slot full. Use your power-up to charge up for another.</p>';return}
    if(!CU.q&&!CU.msg)cuNew();
    el.innerHTML=`<h3>⚡ Charge-up <span class="tag">answer 3 to earn a power-up</span></h3><div class="dots">${[0,1,2].map(i=>`<i class="${i<CU.charge?'on':''}"></i>`).join('')}</div>${CU.msg?`<p class="big" style="text-align:center">${CU.msg}</p>`:'<div id="cuq"></div>'}`;
    if(!CU.msg)mcq($('#cuq'),CU.q,i=>{if(Date.now()<CU.lock)return;
      if(i===CU.q.ans){CU.charge++;CU.q=null;
        if(CU.charge>=3){const k=PUKEYS[Math.random()*PUKEYS.length|0];R.child('players/'+pid+'/pu').set(k);if(me)me.pu=k;lastHeld=k;CU.charge=0;CU.msg=`You earned ${PUS[k].i} ${PUS[k].n}!`;sfx('win');renderPU();setTimeout(()=>{CU.msg='';renderCU()},2500)}}
      else{CU.lock=Date.now()+1000;CU.q=null;setTimeout(renderCU,1050)}
      renderCU()},Date.now()<CU.lock)}
  function joinView(){view(`<div class="card" style="text-align:center">${heroHtml(460)}<p>Win ${cfg.target} duels before anyone else. A different mini game every match!</p><label>Your name (first name and initial)<input id="nm" maxlength="20" autocomplete="off" style="text-align:center;font-size:20px;margin-top:6px"></label><p><button class="go" id="jn" style="font-size:20px;padding:12px 30px">Join</button></p></div>`);
    $('#nm').value=localStorage.getItem(SK+'name')||'';$('#nm').focus();
    const go=()=>{const n=$('#nm').value.trim();if(!n)return;localStorage.setItem(SK+'name',n);
      R.child('players/'+pid).update({name:n,hb:TS});me=Object.assign({},me,{name:n});route()};
    $('#jn').onclick=go;$('#nm').onkeydown=e=>{if(e.key==='Enter')go()}}
  function route(){if(cur)return;
    if(cfg.over){overView();return}
    if(cfg.reached){R.child('players/'+pid+'/ready').set(null);showHold();return}
    if(phaseLive()){R.child('players/'+pid+'/ready').set(TS);showWait()}
    else{R.child('players/'+pid+'/ready').set(null);showLobby()}}
  function showHold(){const o=cfg.reached,mine=o.pid===pid;
    view(`<div class="card" style="text-align:center"><div class="gicon">🏁</div><h1>${mine?'You hit '+cfg.target+' wins!':esc(o.name)+' hit '+cfg.target+' wins!'}</h1><p>Your teacher is about to announce the winner…</p><div class="radar"><i></i><i></i><i></i><b></b></div></div><div class="card" id="lbw">${lbHtml()}</div>`);
    live=true;holdOn=true}
  function clap(){const t=Date.now();if(t-lastC<70)return;lastC=t;clapN++;const b=$('#clapb');if(b)fx(true,b,'👏');
    if(!clapT)clapT=setTimeout(()=>{clapT=null;R.child('claps/'+pid).set({n:clapN})},150)}
  function showLobby(){view(`<div class="card" style="text-align:center">${heroHtml(320)}<h2 style="margin-top:4px">Lobby</h2><p>Waiting for your teacher to start the game…</p><p class="tag" id="lcount"></p><div class="row" id="lpl" style="justify-content:center"></div></div>
    <div class="card"><h3>🐔 While you wait: Chicken Crossing</h3><p class="tag">Arrow keys or WASD (or the buttons). Dodge the cars and go as far as you can. Your best score goes on the lobby board!</p><div id="lg"></div><div class="lb" id="lbs" style="margin-top:12px"></div></div>
    <div class="card"><details><summary><b>How to play</b> (tap to open)</summary>${guideHtml()}</details></div>`);
    inLobby=true;refreshLobby();
    stopLobby=startCrossy($('#lg'),best=>{const b=(lobbyS[pid]||{}).best||0;if(best>b)R.child('lobby/'+pid).set({name:myName(),best})})}
  function refreshLobby(){if(!inLobby)return;const pl=Object.entries(allP).filter(([k,p])=>p.name);
    const c=$('#lcount');if(c)c.textContent=`${pl.length} player${pl.length===1?'':'s'} joined`;
    const l=$('#lpl');if(l)l.innerHTML=pl.map(([k,p])=>`<span class="pill" style="display:inline-flex;gap:6px;align-items:center;padding:3px 10px 3px 4px">${av(p.name,22)}${esc(p.name)}</span>`).join('');
    const b=$('#lbs');if(b){const rows=Object.entries(lobbyS).map(([k,v])=>({k,n:v.name,b:v.best})).sort((a,b)=>b.b-a.b).slice(0,5);
      b.innerHTML='<p class="tag">Lobby high scores</p>'+(rows.map((x,i)=>`<div class="r ${x.k===pid?'me':''}"><span style="width:24px">${i+1}</span>${av(x.n,24)}<span style="flex:1">${esc(x.n)}</span><b>${x.b}</b></div>`).join('')||'<p class="tag">No scores yet. Be the first!</p>')}}
  function showWait(){view(`<div class="card" style="text-align:center"><div class="radar"><i></i><i></i><i></i><b></b></div><h2>Finding an opponent…</h2><p class="tag">Matched by rank, as soon as someone is free.</p><div class="dots" id="dts">${dotsHtml()}</div><p class="tag" id="wn">${myWins()} of ${cfg.target} wins</p></div><div class="card" id="pucard"></div><div class="card" id="cu"></div><div class="card" id="lbw">${lbHtml()}</div>`);live=true;waitOn=true;lastHeld=myPU()||'';renderPU();renderCU()}
  function overView(){const o=cfg.over,cer=!!o.cer,mine=o.pid?o.pid===pid:o.name===myName();
    view(`<div class="card" style="text-align:center"><div class="gicon">🏆</div><h1>${esc(o.name)} wins!</h1><p>They reached ${cfg.target} wins first. Well played everyone!</p>${cer?(mine?`<p class="big">👏 <span id="clapn">${clapTot}</span> claps!</p><p class="tag">Everyone is clapping for you. Enjoy the applause!</p>`:`<p><button class="go" id="clapb" style="font-size:28px;padding:14px 36px">👏 Clap</button></p><p class="tag">Tap as many times as you like! <b id="clapn">${clapTot}</b> claps so far</p>`):''}</div><div class="card">${lbHtml()}</div>`);
    if(cer&&!mine){$('#clapb').onclick=clap}
    if(!overShown){overShown=true;confetti(120);sfx(mine?'win':'lose')}}
  R.child('cfg').on('value',s=>{cfg=Object.assign({target:5,over:null,topic:null},s.val());
    if(lastReset===null)lastReset=cfg.reset||0;else if((cfg.reset||0)!==lastReset){location.reload();return}
    pairs=cfg.topic&&cfg.topic.pairs&&cfg.topic.pairs.length>=6?cfg.topic.pairs:DEFAULT_TOPIC;stats();
    const wasOver=overShown;if(!cfg.over)overShown=false;
    if(!cur&&me&&me.name){
      if(cfg.over)overView();
      else if(wasOver)route();
      else if(cfg.reached&&(waitOn||inLobby||choosing))route();
      else if(!cfg.reached&&holdOn)route();
      else if(phaseLive()&&inLobby)route();
      else if(!phaseLive()&&waitOn)route()}});
  R.child('lobby').on('value',s=>{lobbyS=s.val()||{};refreshLobby()});
  watchClaps(tot=>{clapTot=tot;const e=$('#clapn');if(e)e.textContent=tot},()=>!!(cfg.over&&cfg.over.cer&&cfg.over.pid===pid));
  R.child('players').on('value',s=>{allP=s.val()||{};let l=null;Object.values(allP).forEach(p=>{const w=p.stats?p.stats.wins:0;if(!l||w>l.wins)l={name:p.name,wins:w}});leader=l;stats();refreshLive();refreshLobby()});
  R.child('players/'+pid).on('value',s=>{me=s.val();stats();refreshLive();if(cur&&cur.tray)cur.tray();
    if(first){first=false;
      if(me&&me.match){R.child(`matches/${me.match}/lost/${pid}`).set(TS);done.add(me.match);view('<div class="card"><h2>Match interrupted</h2><p>You left a match, so it counted as a forfeit. Rejoining the queue…</p></div>');setTimeout(route,2500);return}
      if(!me||!me.name){joinView();return}
      route();return}
    if(me&&me.match&&!done.has(me.match)&&(!cur||cur.id!==me.match))enter(me.match)});
  setInterval(()=>{if(me&&me.name)R.child('players/'+pid+'/hb').set(TS)},4000);

  async function enter(mid){
    if(entering===mid)return;entering=mid;
    const m=(await R.child(`matches/${mid}/meta`).once('value')).val();if(!m||done.has(mid))return;

    const cmp=()=>{if(!c.my||!c.opd||c.ended||c.claimed)return;const o=c.opd;if(c.my.s>o.s||(c.my.s===o.s&&(c.my.t<o.t||(c.my.t===o.t&&c.first))))c.win()};
    c.fin=sc=>{c.my={s:sc,t:Date.now()-(c.tStart||Date.now())};c.send(sc,{done:1,s:sc,t:c.my.t});cmp()};
    R.child(`matches/${mid}/p/${oppId}`).on('value',s=>{const v=s.val();if(!v)return;if(v.x&&v.x.done){c.opd=v.x;cmp()}if(oppCb&&!c.ended)oppCb(v)});

    const note=t=>fx(false,$('#pubtn'),t);
    function renderTray(){const b=$('#pubtn');if(!b)return;const k=myPU();
      if(cfg.nopu){b.style.display='none';return}
      if(!k||k==='pick'){if(PUA.second){b.style.display='';b.disabled=true;b.textContent='🛡️ armed'}else b.style.display='none';return}
      const P=PUS[k],okg=!P.g||P.g.includes(m.game),oks=k!=='skip'||!!c.skip;
      b.style.display='';b.disabled=!(okg&&oks);b.textContent=`${P.i} ${P.n}`;b.title=okg&&oks?P.d:'Not usable in this game';b.onclick=()=>usePU(k)}
    function usePU(k){if(myPU()!==k||c.ended)return;

      c.root=$('#g');c.tStart=Date.now();g.init(c);c.tray=renderTray;window.onPUChange=renderTray;renderTray();$('#rbtn').onclick=()=>showRules(m.game);
      c.every(250,()=>{const rem=Math.max(0,t0+c.limit-now()),e=$('#tl'),b=$('#tbi');if(e){e.textContent=Math.ceil(rem/1000)+'s';e.style.color=rem<10000?'var(--bad)':''}if(b)b.style.width=(rem/c.limit*100)+'%'})}

}

  function gmRender(){$('#gm').innerHTML=GAMES.map(k=>`<label><input type="checkbox" data-k="${k}" ${(cfg.off||{})[k]?'':'checked'}> ${G[k].name}</label>`).join('')+`<label style="border-left:2px solid var(--accent);padding-left:12px"><input type="checkbox" data-pu="1" ${cfg.nopu?'':'checked'}> ⚡ Power-ups</label><label style="border-left:2px solid var(--accent);padding-left:12px" title="${cfg.phase==='live'?'Locked while the game is live. Go back to the lobby to change it.':'When someone reaches the target, you declare the winner and everyone gets a clap button.'}"><input type="checkbox" data-cer="1" ${cfg.noceremony?'':'checked'} ${cfg.phase==='live'?'disabled':''}> 🏆 Winner ceremony${cfg.phase==='live'?' (locked while live)':''}</label>`;

    setTimeout(()=>{R.child('matches/'+a.mid).remove();delete active[a.mid]},20000)}
  setInterval(()=>{ // timeouts, disconnects, matchmaking
    const t=now();
    Object.values(active).forEach(a=>{if(a.done)return;const oa=P[a.a]||{},ob=P[a.b]||{};
      if(!online(oa)||!online(ob)){return end(a,null,true)}
      if(t>a.start+COUNTDOWN+a.limit+3000){const pv=a.v&&a.v.p||{},va=(pv[a.a]||{}).v||0,vb=(pv[a.b]||{}).v||0;
        end(a,va===vb?(Math.random()<.5?a.a:a.b):(va>vb?a.a:a.b))}});
    if(cfg.over||cfg.reached||cfg.phase!=='live')return;
    const q=Object.entries(P).filter(([k,p])=>p.name&&p.ready&&!p.match&&online(p)).map(([k,p])=>({pid:k,rank:p.stats?p.stats.rank:1000,ready:Math.min(p.ready,t),recent:p.recent||[]}));
    pairUp(q,t).forEach(([x,y])=>{const mid=R.child('matches').push().key,game=pairGame(x,y),seed=Math.random()*2147483647|0;
      const u={};u[`matches/${mid}/meta`]={a:x,b:y,game,seed,limit:G[game].dur||LIMIT,start:TS};
      u[`players/${x}/match`]=mid;u[`players/${y}/match`]=mid;u[`players/${x}/pick`]=null;u[`players/${y}/pick`]=null;u[`players/${x}/ready`]=null;u[`players/${y}/ready`]=null;
      P[x]=Object.assign({},P[x],{match:mid,ready:null});P[y]=Object.assign({},P[y],{match:mid,ready:null});
      R.update(u).then(()=>R.child(`matches/${mid}/meta`).once('value')).then(s=>watch(mid,s.val()))})
  },700);
}
function startBoard(){
  V.className='wide';$('#stats').textContent='';
  let P={},cfg={target:5,over:null},M={},feed=[],lastOver=false,L={},BCLAP=0;
  V.innerHTML=`<div id="lobb"></div><div id="ovb"></div><div class="bgrid" id="mgrid"><div class="card"><h2 style="font-size:30px">Leaderboard <span class="tag">first to <b id="tgt"></b> wins</span></h2><div id="brows" class="lb big"></div></div><div><div class="card"><h3>Live matches</h3><div id="blive"></div></div><div class="card"><h3>Latest results</h3><div id="bfeed" class="tag"></div></div></div></div>`;
  const online=p=>p.hb&&now()-p.hb<15000;
  function render(){
    const rows=Object.entries(P).filter(([k,p])=>p.name).map(([k,p])=>({p,w:p.stats?p.stats.wins:0,rk:p.stats?p.stats.rank:1000})).sort((a,b)=>b.w-a.w||b.rk-a.rk);
    const med=['🥇','🥈','🥉'];$('#tgt').textContent=cfg.target;
    $('#brows').innerHTML=rows.map((r,i)=>`<div class="r" style="${online(r.p)?'':'opacity:.45'}"><span style="width:34px;font-size:22px;text-align:center">${med[i]||i+1}</span>${av(r.p.name,40)}<span class="bn">${esc(r.p.name)}</span><div class="bar"><i style="width:${Math.min(100,r.w/cfg.target*100)}%"></i></div><b class="bw">${r.w}</b><span class="pill">${r.p.match?'⚔ playing':r.p.ready?'waiting':'&nbsp;'}</span>${r.w===cfg.target-1&&cfg.target>1?'<span title="One win away">🔥</span>':''}</div>`).join('')||'<p class="tag">Waiting for players to join…</p>';
    const live=Object.entries(M).filter(([k,m])=>m.meta&&!m.result);
    $('#blive').innerHTML=live.length?live.map(([k,m])=>{const a=P[m.meta.a],b=P[m.meta.b];return `<div class="r">${ICONS[m.meta.game]||''} ${av(a&&a.name,28)} ${esc(a?a.name:'?')} <b>vs</b> ${av(b&&b.name,28)} ${esc(b?b.name:'?')}</div>`}).join(''):'<p class="tag">No matches right now.</p>';
    $('#bfeed').innerHTML=feed.length?feed.map(f=>`<div>${esc(f)}</div>`).join(''):'Results will appear here.';
    const lob=cfg.phase!=='live'&&!cfg.over;$('#mgrid').style.display=lob?'none':'';
    if(lob){const pl=Object.values(P).filter(p=>p.name),top=Object.values(L).sort((a,b)=>b.best-a.best).slice(0,8);
      $('#lobb').innerHTML=`<div class="card" style="text-align:center">${heroHtml(560)}<h1 style="font-size:40px;margin-top:6px">Lobby</h1><p class="big">${pl.length} player${pl.length===1?'':'s'} joined. Waiting for the teacher to start.</p><div class="row" style="justify-content:center">${pl.map(p=>`<span class="pill" style="display:inline-flex;gap:6px;align-items:center;padding:3px 12px 3px 4px;font-size:16px">${av(p.name,28)}${esc(p.name)}</span>`).join('')}</div></div>
      <div class="bgrid"><div class="card"><h2>🐔 Chicken Crossing high scores</h2><div class="lb big">${top.map((v,i)=>`<div class="r"><span style="width:34px;text-align:center;font-size:22px">${['🥇','🥈','🥉'][i]||i+1}</span>${av(v.name,38)}<span class="bn">${esc(v.name)}</span><b class="bw">${v.best}</b></div>`).join('')||'<p class="tag">Waiting for scores…</p>'}</div></div>
      <div class="card"><h2>How to play</h2>${guideHtml(GAMES.filter(k=>!(cfg.off||{})[k]))}</div></div>`}else $('#lobb').innerHTML='';
    $('#ovb').innerHTML=cfg.over?`<div class="card" style="text-align:center"><div class="gicon">🏆</div><h1 style="font-size:48px">${esc(cfg.over.name)} wins!</h1>${cfg.over.cer?`<p class="big">👏 <span id="bclap">${BCLAP}</span> claps</p>`:''}</div>`:(cfg.reached?`<div class="card" style="text-align:center"><div class="gicon">🏁</div><h1 style="font-size:40px">${esc(cfg.reached.name)} has reached ${cfg.target} wins!</h1><p class="big">Waiting for the teacher to announce the winner…</p></div>`:'');
  }
  R.child('cfg').on('value',s=>{cfg=Object.assign({target:5,over:null},s.val());if(cfg.over&&!lastOver)confetti(160);lastOver=!!cfg.over;render()});
  R.child('players').on('value',s=>{P=s.val()||{};render()});
  R.child('matches').on('value',s=>{M=s.val()||{};render()});
  R.child('feed').on('value',s=>{feed=s.val()||[];render()});
  R.child('lobby').on('value',s=>{L=s.val()||{};render()});
  watchClaps(tot=>{BCLAP=tot;const e=$('#bclap');if(e)e.textContent=tot},()=>!!(cfg.over&&cfg.over.cer));
  setInterval(render,3000);
}
IS_B?startBoard():IS_T?startTeacher():startStudent();
</script></body></html>
